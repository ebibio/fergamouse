<!DOCTYPE html>
<html lang="en">

<head>
  <meta property="og:title" content="Journey Through The Stars">
  <meta property="og:description" content="Embark on a magical journey through the stars with our beloved Fergie. Step into the enchanting world of stars, where friendships shine like constellations and dreams take flight.">
  <meta property="og:image" content="https://cdn.discordapp.com/attachments/1111388441352097822/1111397591033327707/preview-image.png">
  <meta property="og:type" content="website">
  <meta name="viewport" content="width=1080">
  <title>Journey Through The Stars</title>
  <link rel="icon" type="image/x-icon" href="favico.svg">
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100vh;
      overflow: hidden;
      background: #000 url(background.jpg) no-repeat;
      background-size: cover;
    }

    #video-container {
      position: absolute;
      margin: auto;
      width: 100%;
      height: 100%;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      -webkit-appearance: none;
      background: black;
      overflow: hidden;
    }

    #play-button {
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      -webkit-appearance: none;
      object-fit: cover;
      transition: opacity 0.3s ease-in-out;
    }
  </style>
</head>

<body>
  <div id="video-container">
    <video playsinline preload id="my-video">
     <source src="https://cdn.discordapp.com/attachments/1111388441352097822/1111652993088114751/Phone.mp4?ex=66cb3707&is=66c9e587&hm=83f3228b665402a539f43c7c1ab30ba102b029acd8b783e00330eb72b4248ccd&" type="video/mp4">
     <source src="https://cdn.discordapp.com/attachments/1111388441352097822/1111666554401202257/Phone.webm?ex=66cb43a8&is=66c9f228&hm=f3681531449aead2ee83d0271428c724db448e1d3eabd22d5760ccd6076d79d6&" type="video/webm">
    </video>
    <div id="play-button"><IMG src="https://cdn.discordapp.com/attachments/1111388441352097822/1111388796970348615/button.gif?ex=66cae9b9&is=66c99839&hm=7884b4c32ca62d4ec1ea31e3c59fa6d3a5353bd6386a59a38d15701fe35d4c52&" alt="a button ffs"></div>
  </div>

  <script type="text/javascript">
    const playButton = document.getElementById('play-button');
    const video = document.getElementById('my-video');

    playButton.addEventListener('click', () => {
      video.play();
      playButton.style.opacity = '0';
    });

    video.addEventListener('play', () => {
      playButton.style.opacity = '0';
    });

    video.addEventListener('pause', () => {
      playButton.style.opacity = '1';
    });

    video.addEventListener('ended', () => {
      playButton.style.opacity = '1';
    });

  </script>
</body>

</html>
